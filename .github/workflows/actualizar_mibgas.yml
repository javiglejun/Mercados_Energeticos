name: Actualizar datos de MIBGAS

on:
  workflow_dispatch:

  schedule:
    - cron: "00 07 * * *"

permissions:
  contents: write

jobs:
  actualizar-mibgas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar actualizacion de MIBGAS
        run: |
          python MIBGAS_Historico.py

      - name: Comprobar cambios
        id: cambios
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar datos actualizados
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Actualizacion diaria MIBGAS"
          git push
