name: Actualizar datos de MIBGAS

on:
  workflow_dispatch:

  schedule:
    - cron: "00 07 * * *"

permissions:
  contents: write

jobs:
  actualizar-mibgas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar actualizacion de MIBGAS
        run: |
          python MIBGAS_Historico.py

      - name: Verificar que se ha generado el CSV
        run: |
          echo "Contenido del repositorio:"
          find . -maxdepth 3 -type f | sort

          if [ ! -f "data/MIBGAS_$(date +%Y).csv" ]; then
            echo "ERROR: No se ha generado el CSV esperado."
            exit 1
          fi

          echo "CSV generado correctamente:"
          ls -lh "data/MIBGAS_$(date +%Y).csv"

          echo "Primeras filas:"
          head -n 3 "data/MIBGAS_$(date +%Y).csv"

      - name: Preparar cambios
        run: |
          git add data/

      - name: Comprobar cambios
        id: cambios
        run: |
          if git diff --cached --quiet; then
            echo "hay_cambios=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios que guardar."
          else
            echo "hay_cambios=true" >> "$GITHUB_OUTPUT"
            echo "Se han detectado cambios:"
            git status --short
          fi

      - name: Guardar datos actualizados
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizacion diaria MIBGAS"
          git push
